version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: soldino-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: soldino
      POSTGRES_PASSWORD: soldino_dev_password
      POSTGRES_DB: soldino
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soldino"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: soldino-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
